<!-- accordion: collapsible sections (FAQ, Transcript) -->
<div class="accordion">

  <div class="accordion__item">
    <button class="accordion__trigger" aria-expanded="false" aria-controls="acc-transcript">
      <span class="accordion__label">Transcript</span>
      <span class="accordion__icon" aria-hidden="true">+</span>
    </button>
    <div class="accordion__panel" id="acc-transcript" hidden>
      <div class="body-text">
        <p>Transcript content goes here.</p>
      </div>
    </div>
  </div>

  <div class="accordion__item">
    <button class="accordion__trigger" aria-expanded="false" aria-controls="acc-faq-1">
      <span class="accordion__label">Where is The New York Times Food Festival?</span>
      <span class="accordion__icon" aria-hidden="true">+</span>
    </button>
    <div class="accordion__panel" id="acc-faq-1" hidden>
      <div class="body-text">
        <p>Answer goes here.</p>
      </div>
    </div>
  </div>

  <div class="accordion__item">
    <button class="accordion__trigger" aria-expanded="true" aria-controls="acc-faq-2">
      <span class="accordion__label">Lorem ipsum dolor sit amet</span>
      <span class="accordion__icon" aria-hidden="true">−</span>
    </button>
    <div class="accordion__panel" id="acc-faq-2">
      <div class="body-text">
        <p>Answer goes here.</p>
      </div>
    </div>
  </div>

</div>
