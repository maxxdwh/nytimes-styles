<!-- media-block: image or video with optional play button -->
<!-- aspect ratios via modifier: .media-block--16x9  .media-block--4x3  .media-block--1x1 -->

<!-- Video with play button -->
<figure class="media-block media-block--16x9">
  <img src="" alt="" class="media-block__img" loading="lazy" />
  <button class="media-block__play" aria-label="Play video">
    <svg class="media-block__play-icon" viewBox="0 0 24 24" aria-hidden="true">
      <polygon points="5,3 19,12 5,21" />
    </svg>
  </button>
</figure>

<!-- Plain image -->
<figure class="media-block media-block--3x2">
  <img src="" alt="" class="media-block__img" loading="lazy" />
</figure>
