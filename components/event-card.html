<!-- event-card: card used in listing grids -->
<!-- modifier: .event-card--featured (larger, used in top slot) -->

<!-- Standard card -->
<article class="event-card">
  <a href="#" class="event-card__link">
    <div class="event-card__media media-block media-block--16x9">
      <img src="" alt="" class="media-block__img" loading="lazy" />
      <button class="media-block__play" aria-label="Play video">
        <svg class="media-block__play-icon" viewBox="0 0 24 24" aria-hidden="true"><polygon points="5,3 19,12 5,21" /></svg>
      </button>
    </div>
    <div class="event-card__body">
      <p class="event-card__date">Aug 27</p>
      <h3 class="event-card__title">Tony Blair on How Russia's War Will Change the World: A Virtual Event</h3>
      <p class="event-card__sponsor">Presented by Sponsor Name</p>
      <ul class="tags" aria-label="Topics">
        <li><span class="tag">Climate</span></li>
        <li><span class="tag">Politics</span></li>
      </ul>
    </div>
  </a>
</article>

<!-- Featured card (top of listing) -->
<article class="event-card event-card--featured">
  <a href="#" class="event-card__link">
    <div class="event-card__media media-block media-block--16x9">
      <img src="" alt="" class="media-block__img" loading="lazy" />
    </div>
    <div class="event-card__body">
      <p class="event-card__date">Aug 27</p>
      <h2 class="event-card__title">Lorem ipsum amet</h2>
      <p class="event-card__sponsor">Presented by Sponsor Name</p>
      <ul class="tags" aria-label="Topics">
        <li><span class="tag">Climate</span></li>
        <li><span class="tag">Politics</span></li>
      </ul>
    </div>
  </a>
</article>
